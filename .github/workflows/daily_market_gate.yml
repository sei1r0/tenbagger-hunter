name: Daily Market Gate

on:
  schedule:
    - cron: '35 22 * * 0-4'
  workflow_dispatch:

jobs:
  market_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Gate Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python src/daily_gate.py

      - name: Notify on Failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('LINE_CHANNEL_ACCESS_TOKEN')
          uid = os.getenv('LINE_USER_ID')
          if token and uid:
              endpoint = 'https://api.line.me/v2/bot/message/push'
              headers = {'Content-Type': 'application/json', 'Authorization': f'Bearer {token}'}
              payload = {'to': uid, 'messages': [{'type': 'text', 'text': '🚨【システム異常】Daily Market Gate ジョブの実行中にエラーが発生しました。'}]}
              requests.post(endpoint, headers=headers, json=payload, timeout=10)
          "