name: Daily Close Wrap

on:
  schedule:
    # 毎週 月〜金 15:40 JST (06:40 UTC) に自動実行
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  close_wrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Close Wrap
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: |
          python src/daily_close_wrap.py

      - name: Commit and Push Track Record Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No track record changes to commit."
          else
            git commit -m "chore: auto-sync daily track record stats [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Notify on Failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('LINE_CHANNEL_ACCESS_TOKEN')
          uid = os.getenv('LINE_USER_ID')
          if token and uid:
              endpoint = 'https://api.line.me/v2/bot/message/push'
              headers = {'Content-Type': 'application/json', 'Authorization': f'Bearer {token}'}
              payload = {'to': uid, 'messages': [{'type': 'text', 'text': '🚨【システム異常】Daily Close Wrap ジョブの実行中にエラーが発生しました。'}]}
              requests.post(endpoint, headers=headers, json=payload, timeout=10)
          "

