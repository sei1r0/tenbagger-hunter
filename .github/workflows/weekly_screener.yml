name: Weekly Stock Screener

on:
  schedule:
    # 毎週日曜日 JST 06:00 (UTC 土曜 21:00)
    - cron: '0 21 * * 6'
  workflow_dispatch:

jobs:
  screen_stocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 抽出結果JSONを自動コミットするために書き込み権限を付与

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Screener
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python src/weekly_screener.py

      - name: Commit and Push Candidate Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screened_candidates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update screened candidates [skip ci]" && git push)

      - name: Notify on Failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('LINE_CHANNEL_ACCESS_TOKEN')
          uid = os.getenv('LINE_USER_ID')
          if token and uid:
              endpoint = 'https://api.line.me/v2/bot/message/push'
              headers = {'Content-Type': 'application/json', 'Authorization': f'Bearer {token}'}
              payload = {'to': uid, 'messages': [{'type': 'text', 'text': '🚨【システム異常】Weekly Screener ジョブの実行中にエラーが発生しました。'}]}
              requests.post(endpoint, headers=headers, json=payload, timeout=10)
          "